<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content-type="application/javascript">
    <link rel="icon" type="image/svg+xml" href="src/assets/piece.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles/stage.css">
    <link rel="stylesheet" href="src/styles/style.css">
    <link rel="stylesheet" href="src/styles/galaxy.css">
    <base href="/" />
    <title>O-Trek</title>
  </head>
  <body>
    <main id="exhibition" class="turtle">
      <!-- Just for UI purposes, no function -->
      <div class="border" role="presentation">
        <div class="frames" role="presentation">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
        <div class="corners" role="presentation">
          <div></div>
          <div></div>
        </div>
      </div>
      <!-- Fixed viewport frame -->
      <div class="viewport">
        <!-- Rotation/skew wrapper -->
        <div class="stage">
          <!-- Animation/transform wrapper -->
          <div class="canvas direction-rtl" id="canvas">
          <!-- Individual shard containers -->
          </div>
          <div class="info-wrapper">
            <ul>
              <li>
                <h3>PIECE<span id="shard-index-title">10</span></h3>
              </li>
              <li><h2 id="shard-main-title">TITLE HERE</h2></li>
            </ul>
          </div>
        </div>
        <nav class="nav-controls">
          <span id="prev-btn-wrapper">
            <button class="prev-btn" aria-label="previous page">
              <svg width="249" height="249" viewBox="0 0 249 249" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="124.5" cy="124.5" r="117.5" stroke="white" stroke-width="12"/>
                <path d="M79 154L125.31 96L171 154" stroke="white" stroke-width="12" stroke-linecap="round"/>
              </svg>
            </button>
            <div class="control-popup" id="prev-popup" aria-label="name of previous page">
              PREV
            </div>
          </span>
          <span class="next-btn-wrapper">
            <button class="next-btn" aria-label="next page">
              <svg width="249" height="249" viewBox="0 0 249 249" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="124.5" cy="124.5" r="117.5" stroke="white" stroke-width="12"/>
                <path d="M79 154L125.31 96L171 154" stroke="white" stroke-width="12" stroke-linecap="round"/>
              </svg>
            </button>
            <div class="control-popup" id="next-popup" aria-label="name of next page">
              NEXT
            </div>
          </span>
        </nav>
        <div class="fullscreen-overlay spotlight"> 
          <div class="shard-selection">
            <span id="title-content" class="general">
              <h1>IN PIECES</h1>
              <h2>10 THINGS</h2>
              <h2>10 PIECES</h2>
              <h3>EXPLORING PATAGONIA</h3>
            </span>
          </div>
        </div>
        <div id="orbit" class="hidden">
          <span class="dot"><span class="inner-dot"></span></span>
          <span class="dot"><span class="inner-dot"></span></span>
          <span class="dot"><span class="inner-dot"></span></span>
          <span class="dot"><span class="inner-dot"></span></span>
          <span class="dot"><span class="inner-dot"></span></span>
          <span class="dot"><span class="inner-dot"></span></span>
          <span class="dot"><span class="inner-dot"></span></span>
          <span class="dot"><span class="inner-dot"></span></span>
          <span class="dot"><span class="inner-dot"></span></span>
          <span class="dot"><span class="inner-dot"></span></span>
        </div>
        <nav class="info-controls">
          <span id="menu-btn-wrapper">
            <button class="open" id="open-close-btn" aria-label="open menu">
              <svg width="249" height="249" viewBox="0 0 249 249" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="124.5" cy="124.5" r="119.5" stroke="white" stroke-width="10"/>
                <rect x="117.147" y="62" width="13.7868" height="125" rx="6.89338" fill="white"/>
                <rect x="62" y="130.934" width="13.7868" height="125" rx="6.89338" transform="rotate(-90 62 130.934)" fill="white"/>
              </svg>
            </button>
            <div class="info-popup" id="menu-popup" aria-label="menu of all items">
              ALL PIECES
            </div>
          </span>
        </nav>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
